name: Deploy to EC2 Ubuntu (Dental Frontend)

on:
  push:
    branches:
      - main  # Triggers deployment on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'  # Change if you're using a different version

    - name: Install dependencies
      run: npm install

    - name: Build the project
      run: npm run build  # This will generate the dist/ folder for Vite

    - name: Set up SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: Deploy dist folder to EC2
      run: |
        rsync -avz --delete -e "ssh -o StrictHostKeyChecking=no -i ec2_key.pem" dist/ ubuntu@13.49.78.167:/var/www/html/
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@13.49.78.167 << 'EOF'
          sudo chown -R www-data:www-data /var/www/html
          sudo systemctl restart nginx
        EOF
