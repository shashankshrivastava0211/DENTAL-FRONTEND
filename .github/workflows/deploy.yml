name: Deploy to EC2 Ubuntu (Dental Frontend)

on:
  push:
    branches:
      - main  # Triggers deployment on push to main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ubuntu@13.49.78.167 << 'EOF'
          sudo rm -rf /var/www/html/*
          sudo git clone https://github.com/shashankshrivastava0211/DENTAL-FRONTEND.git /var/www/html
          sudo chown -R www-data:www-data /var/www/html
          sudo systemctl restart apache2 || sudo systemctl restart nginx
        EOF
