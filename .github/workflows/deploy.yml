name: Deploy to EC2

on:
  push:
    branches:
      - main  # or change to your deployment branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up SSH key
      run: |
        echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
        chmod 600 ec2_key.pem

    - name: Deploy to EC2
      run: |
        ssh -o StrictHostKeyChecking=no -i ec2_key.pem ec2-user@<EC2_PUBLIC_IP> << 'EOF'
          cd /home/ec2-user/<your-project-folder>
          git pull origin main
          npm install             # Change this line as needed
          pm2 restart app         # Change this line as needed
        EOF
